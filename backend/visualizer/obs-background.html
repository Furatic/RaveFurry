<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FURATIC OBS Background</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#12294b}
canvas{display:block;width:100%;height:100%}
#status{position:absolute;bottom:10px;left:12px;color:#fff;font:13px system-ui;background:#15233bcc;padding:6px 9px;border-radius:5px;pointer-events:none}
#status[hidden]{display:none}
</style>
</head>
<body>
<canvas id="background" role="img" aria-label="FURATIC colored gas clouds with music-reactive lighting"></canvas>
<div id="status" hidden></div>
<script>
(() => {
  'use strict';
  const canvas=document.getElementById('background'),status=document.getElementById('status');
  const options=new URLSearchParams(location.search);
  const debug=options.get('debug')==='1',demo=options.get('demo');
  const validModes=['silence','gentle','rhythm','intense'];
  const simulated=validModes.includes(demo);
  const port=Number(options.get('port')||((location.protocol==='http:'&&['127.0.0.1','localhost'].includes(location.hostname))?location.port:8766));
  const delay=Math.max(0,Math.min(.250,Number(options.get('delay')||0)/1000))||0;
  // Enough fixed slots for the detector's maximum onset rate, including delay.
  const LIGHT_COUNT=96;
  const gl=canvas.getContext('webgl2',{alpha:false,antialias:false,depth:false,stencil:false,preserveDrawingBuffer:false,powerPreference:'high-performance'});
  function report(message,error=false){status.hidden=!debug&&!error;if(debug||error)status.textContent=message;}

  const vs = `#version 300 es
  in vec2 a_position;
  out vec2 v_uv;
  void main(){v_uv=a_position*.5+.5;gl_Position=vec4(a_position,0.,1.);}`;
  const fs = `#version 300 es
  precision highp float;
  in vec2 v_uv;
  uniform vec2 u_resolution;
  uniform vec4 u_motion;
  uniform vec4 u_clouds[4];
  uniform vec4 u_music;
  uniform vec4 u_energy;
  uniform vec4 u_sizes;
  uniform float u_bands[48];
  uniform vec4 u_lights;
  uniform vec4 u_edgeEnergy;
  uniform vec4 u_edgeLights;
  uniform vec4 u_edgeMusic;
  uniform float u_edgeBands[48];
  out vec4 fragColor;
  float hash(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}

    // details shimmer as a moving cloud crosses pixels (including at 720p).

  float spectrum(float k,float overlap){k=clamp(k,0.,47.);int i=int(floor(k)),j=min(i+1,47);float live=mix(u_bands[i],u_bands[j],fract(k));float edge=mix(u_edgeBands[i],u_edgeBands[j],fract(k));return mix(live,edge,overlap);}

    // to summing each overlapping pulse here, with just four light uniforms.

      if(envelope<=0.)continue;

      float focus=spot(p,vec2(-.12,.05),vec2(.28,.16));

      col+=mix(c,vec3(.75),.28)*envelope*highlight*illumination*.75*ownership[cloud];

    // the canvas. No floating-point render targets or per-frame texture copies.
    float peak=max(col.r,max(col.g,col.b));

    vec3 displayColor=pow(max(col,0.),vec3(1./2.2));
    float dither=(hash(gl_FragCoord.xy)-.5)/255.;
    fragColor=vec4(clamp(displayColor+dither,0.,1.),1.);
  }`;
  // One program, one immutable geometry buffer, zero offscreen textures/FBOs.
  // At most one submitted GPU frame: a slow GPU cannot build a command backlog.
  let programs=[],buffer=null,loc={},w=0,h=0,lost=false,stopped=false,raf=0;
  let gpuFence=null,resizePending=true,nextRender=0,rendered=0,gpuSkipped=0;
  let obsVisible=true,visible=!document.hidden;
  let socket=null,reconnectTimer=0,retry=500,lastReceived=-Infinity,lastIds=null,connectionOpened=0;
  let lastFrame=0,flowClock=0,simPhase=0,activity=0,driftActivity=0,driftLevel=0,desiredRhythm=0,driftRhythm=0,phraseLevel=0;
  const bands=new Float32Array(48),music=new Float32Array(4),desiredBands=new Float32Array(48),desiredMusic=new Float32Array(4);
  const clouds=new Float32Array(16),motion=new Float32Array(4),lightEnergy=new Float32Array(4);
  const lights=Array.from({length:LIGHT_COUNT},()=>({born:-100,cloud:0,strength:0}));
  const energy=new Float32Array(4),desiredEnergy=new Float32Array(4),balance=new Float32Array(4),desiredBalance=new Float32Array(4),sizes=new Float32Array([.94,.94,.94,.94]);

  // Beats may flash quickly; the gas volume itself has gentle, bounded inertia.
  const sizeTargets=new Float64Array([.94,.94,.94,.94]),sizeVelocity=new Float64Array(4);
  // Fixed, causal phrase envelopes: rapid harmonics/hi-hats drive light, while
  // sustained spectral emphasis drives physical size and neighbor displacement.
  const phraseEnergy=new Float64Array(4),phraseBalance=new Float64Array(4),cloudMass=new Float64Array(4);
  const lightTargets=new Float32Array(4),lightVelocity=new Float64Array(4);
  // Boundary lighting has its own fixed, continuous-velocity animation state.
  // No history textures or framebuffer feedback are needed for the crossfade.
  const edgeEnergy=new Float32Array(4),edgeEnergyVelocity=new Float64Array(4);
  const edgeLights=new Float32Array(4),edgeLightVelocity=new Float64Array(4);
  const edgeMusic=new Float32Array(4),edgeMusicVelocity=new Float64Array(4);
  const edgeBands=new Float32Array(48),edgeBandVelocity=new Float64Array(48);
  const cloudStates=[{x:.19,y:.80,vx:0,vy:0,angle:-.08},{x:.81,y:.80,vx:0,vy:0,angle:-.08},{x:.19,y:.20,vx:0,vy:0,angle:-.08},{x:.81,y:.20,vx:0,vy:0,angle:-.08}];
  const pulse=new Float32Array(4);
  // A separate, bounded pressure response marks measured attacks without
  // feeding fast transients into the slow phrase or neighbor-flow solver.
  // All storage is fixed; no new GPU objects, audio buffers, or frame history.
  const beatMotion=new Float64Array(4),beatVelocity=new Float64Array(4),renderSizes=new Float32Array(4);
  const flowForces=new Float32Array(8);
  const cloudPathPhases=[3*Math.PI/4,Math.PI/4,5*Math.PI/4,7*Math.PI/4];
  let lastCloudIds=null,legacyPrevious=new Float32Array(4),legacyMean=new Float32Array(4),legacyAt=new Float64Array(4);
  const presets={silence:[0,0,96],gentle:[.17,.16,78],rhythm:[.52,.65,112],intense:[.88,1,138]};

  function compile(type,source){

  function freeFence(){if(gpuFence){gl.deleteSync(gpuFence);gpuFence=null;}}

  function gpuReady(){

    const result=gl.clientWaitSync(gpuFence,0,0);
    if(result===gl.TIMEOUT_EXPIRED)return false;
    if(result===gl.WAIT_FAILED){if(gl.isContextLost())return false;throw new Error('GPU completion check failed');}
    if(result!==gl.ALREADY_SIGNALED&&result!==gl.CONDITION_SATISFIED)throw new Error('Unexpected GPU completion state');

  }
  function resize(){
    const cssW=Math.max(1,canvas.clientWidth),cssH=Math.max(1,canvas.clientHeight);
    const scale=Math.min(window.devicePixelRatio||1,1920/cssW,1080/cssH);
    const width=Math.max(1,Math.round(cssW*scale)),height=Math.max(1,Math.round(cssH*scale));
    // Changing even an unchanged canvas dimension reallocates its drawing buffer.
    if(canvas.width!==width)canvas.width=width;
    if(canvas.height!==height)canvas.height=height;
    w=width;h=height;resizePending=false;
  }
  function initialize(){
    // Context loss invalidates the previous native objects; never retain them.
    programs=[];buffer=null;gpuFence=null;

    buffer=gl.createBuffer();if(!buffer)throw new Error('Geometry allocation failed');
    gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    gl.useProgram(programs[0]);const a=gl.getAttribLocation(programs[0],'a_position');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);

    loc={res:at('u_resolution'),motion:at('u_motion'),clouds:at('u_clouds[0]'),music:at('u_music'),energy:at('u_energy'),sizes:at('u_sizes'),bands:at('u_bands[0]'),lights:at('u_lights'),edgeEnergy:at('u_edgeEnergy'),edgeLights:at('u_edgeLights'),edgeMusic:at('u_edgeMusic'),edgeBands:at('u_edgeBands[0]')};
    resizePending=true;if(visible)resize();
  }
  function birth(cloud,strength,born){
    if(strength<.004)return;
    const slot=lights.find(light=>born-light.born>=1.9||light.strength===0);
    if(slot){slot.cloud=cloud;slot.strength=Math.min(1,strength);slot.born=born;}
  }
  const clamp=value=>Math.max(0,Math.min(1,value));
  function settle(values,velocities,index,target,frequency,dt,maxSpeed=Infinity,maxAcceleration=Infinity){
    if(dt<=0)return;

    velocities[index]=boundedVelocity;

  function receive(raw){
    if(typeof raw!=='string'||raw.length>16384)return;
    let data;try{data=JSON.parse(raw);}catch(error){return;}
    if(!data||typeof data!=='object')return;
    if(data.version!==1||!Array.isArray(data.bands)||data.bands.length!==48||!data.bands.every(Number.isFinite))return;
    const values=[data.level,data.bass,data.mid,data.treble,data.activity,data.serverTime,data.kickAt,data.accentAt,data.kickId,data.accentId,data.kick,data.accent];
    if(!values.every(Number.isFinite))return;

    desiredMusic.set([clamp(data.level),clamp(data.bass),clamp(data.mid),clamp(data.treble)]);
    desiredBands.set(data.bands.map(clamp));activity=clamp(data.activity);

  }
  function scheduleReconnect(){

  function connect(){

  function simulate(dt,now){

  function update(dt,now){

    // Preserve quiet-passage travel. Bounded rhythm context adds a modest boost
    // only during louder phrases, eased over 1.2 s. Velocity inertia stays intact.
    const loud=clamp((driftLevel-.40)/.50),intensity=loud*loud*(3-2*loud);
    const speed=1+.28*driftLevel+.20*driftActivity+.24*intensity+.20*intensity*driftRhythm;
    flowClock+=dt*speed;
    pulse.fill(0);lightTargets.fill(0);
    for(const light of lights){
      const age=now-light.born;
      if(age>=1.9)light.strength=0;
      if(!light.strength||age<0)continue;
      const attack=1-Math.exp(-age/.018);
      const fade=clamp((age-1.45)/.45);
      lightTargets[light.cloud]+=attack*(Math.exp(-age/.23)+.16*Math.exp(-age/.75))*(1-fade*fade*(3-2*fade))*light.strength;
      pulse[light.cloud]+=attack*Math.exp(-age/.095)*light.strength;
    }
    let balanceSum=0;
    for(let i=0;i<4;i++){
      phraseEnergy[i]+=(desiredEnergy[i]-phraseEnergy[i])*(1-Math.exp(-dt/(desiredEnergy[i]>phraseEnergy[i]?.45:.85)));
      phraseBalance[i]+=(desiredBalance[i]-phraseBalance[i])*(1-Math.exp(-dt/.75));
      balanceSum+=phraseBalance[i];
    }
    let meanMass=0;
    for(let i=0;i<4;i++){
      energy[i]+=(desiredEnergy[i]-energy[i])*(1-Math.exp(-dt/(desiredEnergy[i]>energy[i]?.035:.30)));
      balance[i]+=(desiredBalance[i]-balance[i])*(1-Math.exp(-dt/.38));
      const share=phraseBalance[i]/Math.max(.0001,balanceSum);
      // Power share already measures relative spectral dominance. A square
      // root flattened it so weak regions looked almost as large as the bass.
      cloudMass[i]=phraseLevel*Math.pow(share,.85);
      meanMass+=cloudMass[i]*.25;
      const targetSize=Math.min(1.58,.84+.10*phraseEnergy[i]+.72*cloudMass[i]);
      // The gas follows a phrase, not every transient. Bound both size speed
      // and acceleration; retargeting never resets existing position/velocity.
      sizeTargets[i]+=(targetSize-sizeTargets[i])*(1-Math.exp(-dt/.30));
      settle(sizes,sizeVelocity,i,sizeTargets[i],5,dt,.10,.30);
      // Smooth late/irregular packet handoffs, with a short response so the
      // lighting still marks the beat rather than sharing the slower geometry.
      // A bounded, monotonic soft knee preserves attack timing but prevents
      // many overlapping decays from turning a dense mix into competing blasts.
      // Short measured attacks provide contrast; long overlapping tails no
      // longer dominate a dense passage as an almost permanent bright glow.
      const accent=.55*lightTargets[i]+.85*pulse[i];
      const light=accent/Math.sqrt(1+(accent/1.35)**2);
      settle(lightEnergy,lightVelocity,i,light,70,dt);
      const pressure=pulse[i]/Math.sqrt(1+(pulse[i]/.9)**2);
      settle(beatMotion,beatVelocity,i,pressure,22,dt,1.2,14);
      renderSizes[i]=sizes[i]+.085*beatMotion[i];
      // Shared colors evolve on a phrase-scale envelope, independently of the
      // quick core pulse. Retargeting preserves velocity through dense rhythms.
      settle(edgeEnergy,edgeEnergyVelocity,i,phraseEnergy[i],7,dt);
      settle(edgeLights,edgeLightVelocity,i,lightEnergy[i],6,dt);
      settle(edgeMusic,edgeMusicVelocity,i,music[i],7,dt);
    }
    for(let i=0;i<48;i++)settle(edgeBands,edgeBandVelocity,i,bands[i],7,dt);
    for(let i=0;i<4;i++){
      const c=cloudStates[i],px=c.x*Math.PI,py=c.y*Math.PI;
      const phase=cloudPathPhases[i];
      const tx=.5+.32*Math.cos(flowClock*.013+phase)+.07*Math.sin(flowClock*.031+i*1.7);
      const ty=.5+.32*Math.sin(flowClock*.017+phase)+.07*Math.cos(flowClock*.029+i*1.9);
      const pathPull=5+1.5*cloudMass[i];
      let fx=(tx-c.x)*pathPull+.30*Math.sin(px+flowClock*.012)*Math.cos(py+flowClock*.017);
      let fy=(ty-c.y)*pathPull-.30*Math.cos(px+flowClock*.012)*Math.sin(py+flowClock*.017);
      fx+=Math.max(0,.14-c.x)*28-Math.max(0,c.x-.86)*28;
      fy+=Math.max(0,.14-c.y)*28-Math.max(0,c.y-.86)*28;
      for(let j=0;j<4;j++)if(i!==j){
        const other=cloudStates[j],dx=c.x-other.x,dy=c.y-other.y,d=Math.hypot(dx,dy);
        // A sustained dominant cloud yields less and gently moves its weaker
        // neighbors. Same audio gives the same relative emphasis, even when
        // the ongoing procedural path starts in a different part of the screen.
        const separation=.42+.045*Math.max(cloudMass[i],cloudMass[j]);
        const mobility=Math.max(.55,Math.min(1.65,1+1.1*(cloudMass[j]-cloudMass[i])));
        const push=Math.max(0,separation-d)*18*mobility/Math.max(.04,d);
        fx+=dx*push;fy+=dy*push;
      }
      const length=Math.max(1,Math.hypot(fx,fy));flowForces[i*2]=fx/length;flowForces[i*2+1]=fy/length;
    }
    let centreX=0,centreY=0;
    for(const c of cloudStates){centreX+=c.x*.25;centreY+=c.y*.25;}
    for(let i=0;i<4;i++){
      const c=cloudStates[i],ease=1-Math.exp(-dt/3.5);
      // Retain spectral inertia even when a crowded pair saturates the force
      // limit. Equal dominance/silence keeps the original travel response.
      const response=1+.32*(meanMass-cloudMass[i]);
      c.vx+=(flowForces[i*2]*.0052*speed*response-c.vx)*ease;c.vy+=(flowForces[i*2+1]*.0052*speed*response-c.vy)*ease;
      c.x+=c.vx*dt;c.y+=c.vy*dt;
      c.angle+=(-.08+.16*Math.sin(flowClock*.012+i*1.9)+c.vy*10-c.angle)*(1-Math.exp(-dt/4));
      // A small outward breath on a real attack, then a smooth release.
      // The persistent drift position/velocity never gets reset or kicked.
      const dx=c.x-centreX,dy=c.y-centreY,distance=Math.max(.12,Math.hypot(dx,dy));
      const breath=.012*beatMotion[i];
      clouds[i*4]=c.x+dx/distance*breath;clouds[i*4+1]=c.y+dy/distance*breath;
      clouds[i*4+2]=Math.cos(c.angle);clouds[i*4+3]=Math.sin(c.angle);
    }
    // Double-precision phases become bounded GPU uniforms: smooth even after days.
    motion.set([Math.sin(flowClock*.019),Math.cos(flowClock*.013),Math.sin(flowClock*.011),Math.cos(flowClock*.017)]);
    if(socket&&now-Math.max(lastReceived,connectionOpened)>3){socket.close();}
  }
  function render(){
    gl.useProgram(programs[0]);gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,w,h);
    gl.uniform2f(loc.res,w,h);gl.uniform4fv(loc.motion,motion);gl.uniform4fv(loc.clouds,clouds);gl.uniform4fv(loc.music,music);gl.uniform4fv(loc.energy,energy);gl.uniform4fv(loc.sizes,renderSizes);gl.uniform1fv(loc.bands,bands);gl.uniform4fv(loc.lights,lightEnergy);
    gl.uniform4fv(loc.edgeEnergy,edgeEnergy);gl.uniform4fv(loc.edgeLights,edgeLights);gl.uniform4fv(loc.edgeMusic,edgeMusic);gl.uniform1fv(loc.edgeBands,edgeBands);
    gl.drawArrays(gl.TRIANGLES,0,3);
    gpuFence=gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE,0);
    if(!gpuFence)throw new Error('GPU fence allocation failed');
    gl.flush();rendered++;
  }
  function frame(timestamp){
    raf=0;if(lost||stopped||!visible)return;
    const now=timestamp/1000,dt=lastFrame?Math.min(.05,Math.max(0,(timestamp-lastFrame)/1000)):1/60;lastFrame=timestamp;
    try{
      update(dt,now);
      if(timestamp+.1>=nextRender){
        if(gpuReady()){
          if(resizePending)resize();render();
          // Phase-based pacing also gives 60 FPS on 120/144 Hz browser callbacks.
          nextRender=Math.max(nextRender,timestamp-1000/60)+1000/60;
        }else gpuSkipped++;
      }
    }catch(error){report('Graphics stopped safely: '+error.message,true);cleanup();return;}
    raf=requestAnimationFrame(frame);
  }
  function setVisibility(){
    const showing=obsVisible&&!document.hidden;
    if(showing===visible||stopped)return;visible=showing;
    cancelAnimationFrame(raf);raf=0;lastFrame=0;nextRender=0;
    if(!visible){
      clearTimeout(reconnectTimer);reconnectTimer=0;
      if(socket){socket.onclose=null;socket.onmessage=null;socket.close();socket=null;}
      lastIds=null;lastCloudIds=null;lastReceived=-Infinity;
      for(const light of lights)light.strength=0;
    }else if(!lost){resizePending=true;if(!simulated)connect();raf=requestAnimationFrame(frame);}
  }
  function obsVisibility(event){if(typeof event.detail?.visible==='boolean'){obsVisible=event.detail.visible;setVisibility();}}
  function cleanup(){
    if(stopped)return;stopped=true;cancelAnimationFrame(raf);clearTimeout(reconnectTimer);if(observer)observer.disconnect();window.removeEventListener('pagehide',cleanup);
    window.removeEventListener('obsSourceVisibleChanged',obsVisibility);document.removeEventListener('visibilitychange',setVisibility);
    if(socket){socket.onclose=null;socket.onmessage=null;socket.close();socket=null;}
    if(!lost){freeGPU();const release=gl.getExtension('WEBGL_lose_context');if(release)release.loseContext();}
  }
  let observer;
  try{initialize();observer=new ResizeObserver(()=>{resizePending=true;});observer.observe(canvas);}
  catch(error){freeGPU();report('Graphics initialization failed: '+error.message,true);return;}
  canvas.addEventListener('webglcontextlost',event=>{if(stopped)return;event.preventDefault();lost=true;gpuFence=null;cancelAnimationFrame(raf);raf=0;report('Graphics context recovering',true);});
  canvas.addEventListener('webglcontextrestored',()=>{if(stopped||!lost)return;try{initialize();lost=false;lastFrame=0;nextRender=0;report('Graphics recovered');if(visible)raf=requestAnimationFrame(frame);}catch(error){freeGPU();lost=false;report('Graphics recovery failed',true);cleanup();}});
  window.addEventListener('pagehide',cleanup,{once:true});
  window.addEventListener('obsSourceVisibleChanged',obsVisibility);document.addEventListener('visibilitychange',setVisibility);
  if(visible){if(!simulated)connect();raf=requestAnimationFrame(frame);}
})();
</script>
