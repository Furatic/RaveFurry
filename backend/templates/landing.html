{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FURATIC</title>
    <meta name="theme-color" content="#050816">
    <link rel="icon" href="https://raw.githubusercontent.com/OrangeC7/ravefurry/refs/heads/master/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="https://raw.githubusercontent.com/OrangeC7/ravefurry/refs/heads/master/favicon.ico" type="image/x-icon">
    <style>
      :root {
        color-scheme: dark;
        --bg: #050816;
        --bg-top: #091022;
        --bg-bottom: #03040b;
        --text: #eef4ff;
        --muted: rgba(238, 244, 255, 0.72);
        --line: rgba(255, 255, 255, 0.12);
        --panel: rgba(7, 10, 22, 0.30);
        --panel-shadow: none;
        --radius: 30px;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, Roboto, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      }

      body {
        position: relative;
        overflow-x: hidden;
      }

      #aurora {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: none;
        z-index: 0;
        background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg) 56%, var(--bg-bottom) 100%);
        transform: translateZ(0);
      }

      .background-gradient,
      .stream-background {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }

      .background-gradient {
        background:
          radial-gradient(ellipse at 74% 12%, rgba(26,60,105,0.34), transparent 55%),
          radial-gradient(ellipse at 12% 76%, rgba(12,28,52,0.20), transparent 54%),
          linear-gradient(155deg, #0b101a 0%, #060910 48%, #03050a 100%);
      }

      .stream-background {
        overflow: hidden;
        opacity: 0;
        transform: scale(1.035);
        filter: blur(14px);
        transition:
          opacity 1600ms cubic-bezier(.22,1,.36,1),
          transform 2400ms cubic-bezier(.22,1,.36,1),
          filter 2000ms cubic-bezier(.22,1,.36,1);
      }

      .stream-background.is-ready { opacity: 1; transform: scale(1); filter: blur(0); }

      .stream-background::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        -webkit-backdrop-filter: blur(40px);
        backdrop-filter: blur(40px);
        background: rgba(3,5,10,0.08);
      }

      .stream-background::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 2;
        background: linear-gradient(180deg, rgba(3,5,10,0.18), rgba(3,5,10,0.46));
      }

      .noise,
      .vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1;
      }

      .noise {
        opacity: 0.045;
        background-image:
          radial-gradient(circle at 20% 20%, rgba(255,255,255,0.12) 0, rgba(255,255,255,0) 34%),
          radial-gradient(circle at 80% 0%, rgba(255,255,255,0.08) 0, rgba(255,255,255,0) 28%);
        mix-blend-mode: screen;
      }

      .vignette {
        background:
          radial-gradient(circle at 50% -10%, rgba(255,255,255,0.06), transparent 42%),
          radial-gradient(circle at 50% 50%, transparent 0%, transparent 54%, rgba(0,0,0,0.22) 100%);
      }

      .page {
        position: relative;
        z-index: 2;
        min-height: 100svh;
        padding: clamp(18px, 3vw, 28px);
        display: grid;
        place-items: start center;
      }

      .shell {
        width: min(100%, 1080px);
        min-width: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 16px;
      }

      .reveal-stage {
        opacity: 0;
        transform: translateY(-28px) scale(0.982);
        filter: blur(12px);
        transition:
          opacity 820ms cubic-bezier(0.22, 1, 0.36, 1),
          transform 1120ms cubic-bezier(0.22, 1, 0.36, 1),
          filter 1120ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      
      body.is-ready .reveal-stage {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: none;
        margin-top: -10px;
        margin-bottom: 10px;
      }
      
      .reveal-stage-1 { transition-delay: 60ms; }
      .reveal-stage-2 { transition-delay: 200ms; }
      .reveal-stage-3 { transition-delay: 340ms; }

      .brand {
        display: grid;
        justify-items: center;
        gap: 0px;
        text-align: center;
      }

      .brand > img.reveal-stage {
        display: block;
        width: min(100%, 405px);
        max-width: 26.25%;
        height: auto;
        margin-top: -10px;
        filter:
          blur(12px)
          drop-shadow(0 18px 42px rgba(0,0,0,0.28))
          drop-shadow(0 0 22px rgba(0,142,248,0.12));
      }
      
      body.is-ready .brand > img.reveal-stage {
        filter:
          blur(0)
          drop-shadow(0 18px 42px rgba(0,0,0,0.28))
          drop-shadow(0 0 22px rgba(0,142,248,0.12));
      }

      @supports (-webkit-touch-callout: none) {
        .brand > img.reveal-stage,
        body.is-ready .brand > img.reveal-stage {
          -webkit-filter: none !important;
          filter: none !important;
        }
      }
      
      .notify-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }

      .notify-button,
      .tv-button,
      .mini-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 46px;
        padding: 0 18px;
        border-radius: 16px;
        color: var(--text);
        text-decoration: none;
        font-weight: 700;
        letter-spacing: 0.01em;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.06);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.04),
          0 10px 28px rgba(0,0,0,0.24);
        transition:
          transform 180ms ease,
          border-color 180ms ease,
          background 180ms ease,
          box-shadow 180ms ease,
          opacity 180ms ease;
        font: inherit;
        cursor: pointer;
      }

      .notify-button:hover,
      .tv-button:hover,
      .mini-button:hover {
        transform: translateY(-1px);
        border-color: rgba(255,255,255,0.18);
        background: rgba(255,255,255,0.09);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.05),
          0 16px 34px rgba(0,0,0,0.28);
      }

      .notify-button.is-disabled {
        opacity: 0.55;
        pointer-events: none;
      }
      
      .icon-button {
        min-width: 54px;
        width: 54px;
        padding: 0;
      }
      
      .icon-button img {
        display: block;
        width: 22px;
        height: 22px;
        max-width: none;
        margin: 0;
      }
      
      .icon-button img:not(.vrchat-icon) {
        filter: brightness(0) invert(1);
      }
      
      .icon-button img.vrchat-icon {
        width: 32px;
        height: 32px;
        max-height: none;
        opacity: 1;
        filter: none;
      }

      .player-layout {
        position: relative;
        width: min(100%, 620px);
        margin: 0 auto;
        display: flex;
        align-items: stretch;
        justify-content: center;
        gap: 14px;
        overflow: visible;
        transition:
          width 520ms cubic-bezier(0.16, 1, 0.3, 1),
          max-width 520ms cubic-bezier(0.16, 1, 0.3, 1);
        will-change: width;
      }
      
      .player-layout.is-tv-open {
        width: min(100%, 1254px);
      }
      
      .player-card,
      .tv-panel {
        position: relative;
        isolation: isolate;
        border-radius: var(--radius);
        background: rgba(6, 10, 22, 0.25);
        box-shadow: var(--panel-shadow);
        -webkit-backdrop-filter: blur(28px) saturate(118%);
        backdrop-filter: blur(28px) saturate(118%);
      }
      
      .player-card {
        overflow: visible;
        width: min(100%, 620px);
        margin: 0;
        flex: 0 0 min(100%, 620px);
        border: 1px solid rgba(255, 255, 255, 0.10);
        opacity: 0;
        filter: blur(18px);
        transform: scale(0.965);
        transform-origin: center center;
        transition:
          opacity 760ms cubic-bezier(0.22, 1, 0.36, 1),
          filter 1080ms cubic-bezier(0.22, 1, 0.36, 1),
          transform 520ms cubic-bezier(0.16, 1, 0.3, 1),
          box-shadow 220ms ease;
        will-change: opacity, filter, transform;
      }
      
      body.is-ready .player-card {
        opacity: 1;
        filter: none;
        transform: scale(1);
      }
      
      body.is-ready .player-layout.is-tv-open .player-card {
        transform: translateX(-6px) scale(1);
      }
      
      .player-card::before,
      .tv-panel::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -2;
        background: rgba(255, 255, 255, 0.018);
      }

      .player-card::before { border-radius: inherit; pointer-events: none; }
      
      .player-card::after,
      .tv-panel::after {
        content: "";
        position: absolute;
        inset: 1px;
        border-radius: calc(var(--radius) - 1px);
        z-index: -1;
        background:
          radial-gradient(circle at top left, rgba(255,255,255,0.10), transparent 30%),
          linear-gradient(180deg, rgba(255,255,255,0.018), rgba(255,255,255,0));
        opacity: 0.8;
        pointer-events: none;
      }
      
      .player-stage {
        position: relative;
        width: 100%;
        margin: 0 auto;
      }
      
      iframe {
        display: block;
        width: 100%;
        height: min(64.6vh, 730px);
        margin: 0 auto;
        border: 0;
        background: transparent !important;
        color-scheme: dark;
      }

      /* Transparent iframe gutters let only Now Playing cross the unchanged
         player-card edge. The framed queue adds the same space back as padding. */
      #queue-player-frame { width: calc(100% + 40px); max-width: none; margin-left: -20px; margin-right: -20px; transition: height 400ms cubic-bezier(.22,1,.36,1); }
      
      .tv-button {
        background: rgba(255,255,255,0.06);
      }
      
      .tv-corner-button {
        position: absolute;
        right: -63px;
        bottom: 18px;
        z-index: 6;
        opacity: 0;
        filter: blur(8px);
        transform: translate3d(34px, 0, 0) scale(0.988);
        backface-visibility: hidden;
        will-change: transform, opacity, filter;
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.06),
          0 18px 34px rgba(0,0,0,0.32);
        transition:
          opacity 760ms cubic-bezier(0.22, 1, 0.36, 1),
          transform 980ms cubic-bezier(0.22, 1, 0.36, 1),
          filter 980ms cubic-bezier(0.22, 1, 0.36, 1),
          background 180ms ease,
          box-shadow 180ms ease;
      }
      
      body.is-ready .tv-corner-button {
        opacity: 1;
        filter: none;
        transform: translate3d(0, 0, 0) scale(1);
        transition-delay: 200ms, 200ms, 200ms, 0ms, 0ms;
      }
      
      body.is-tv-intro-done .tv-corner-button {
        transition-delay: 0ms, 0ms, 0ms, 0ms, 0ms;
      }
      
      .player-layout.is-tv-open .tv-corner-button {
        opacity: 0;
        pointer-events: none;
        filter: blur(8px);
        transform: translate3d(-42px, 0, 0) scale(0.96);
        transition-duration: 380ms, 980ms, 980ms, 180ms, 180ms;
      }
      
      .icon-button:disabled {
        opacity: 0.55;
        pointer-events: none;
        cursor: default;
      }
      
      .tv-panel {
        overflow: hidden;
        flex: 0 0 0;
        padding: 0;
        border: 0 solid transparent;
        display: grid;
        grid-template-rows: auto auto;
        align-self: flex-start;
        gap: 14px;
        width: 0;
        min-width: 0;
        max-width: 0;
        height: auto;
        opacity: 0;
        pointer-events: none;
        transform: translate3d(18px, 0, 0) scale(0.985);
        transform-origin: left center;
        contain: layout paint;
        will-change: transform, opacity, width, padding;
        transition:
          width 520ms cubic-bezier(0.16, 1, 0.3, 1),
          min-width 520ms cubic-bezier(0.16, 1, 0.3, 1),
          max-width 520ms cubic-bezier(0.16, 1, 0.3, 1),
          opacity 320ms cubic-bezier(0.22, 1, 0.36, 1),
          transform 620ms cubic-bezier(0.16, 1, 0.3, 1),
          padding 520ms cubic-bezier(0.16, 1, 0.3, 1),
          border-color 280ms ease;
      }
      
      .player-layout.is-tv-open .tv-panel {
        flex: 0 0 min(100%, 930px);
        width: min(100%, 930px);
        min-width: min(100%, 930px);
        max-width: min(100%, 930px);
        height: auto;
        padding: 16px;
        border-width: 1px;
        border-color: rgba(255, 255, 255, 0.10);
        opacity: 1;
        pointer-events: auto;
        transform: translate3d(0, 0, 0) scale(1);
      }
      
      .tv-panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 46px;
      }
      
      .tv-panel h2 {
        margin: 0;
        font-size: 18px;
        letter-spacing: -0.02em;
        padding-left: 14px;
      }
      
      .tv-video-shell {
        position: relative;
        width: 100%;
        height: auto;
        min-height: 0;
        border-radius: 24px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
        background:
          linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02)),
          radial-gradient(circle at top left, rgba(255,255,255,0.06), transparent 34%);
        border: 1px solid rgba(255,255,255,0.08);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.04),
          0 18px 40px rgba(0,0,0,0.28);
      }
      
      .tv-video {
        width: 100%;
        max-width: 100%;
        max-height: 100%;
        aspect-ratio: 16 / 9;
        height: auto;
        object-fit: contain;
        background: #000;
        border-radius: 20px;
        border: 1px solid rgba(255,255,255,0.10);
        box-shadow: 0 18px 40px rgba(0,0,0,0.30);
      }

      .tv-stream-error {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
        color: var(--text);
        background: #060910;
      }
      .tv-stream-error[hidden] { display: none; }
      .tv-video-shell.is-stream-error > .tv-video { visibility: hidden; }

      .event-notifications {
        position: fixed;
        top: 18px;
        right: 18px;
        z-index: 40;
        width: min(370px, calc(100vw - 28px));
        max-height: calc(100dvh - 36px);
        overflow-y: auto;
        display: grid;
        gap: 10px;
        pointer-events: none;
      }

      .event-notification {
        position: relative;
        display: grid;
        grid-template-columns: 40px minmax(0, 1fr);
        gap: 12px;
        align-items: center;
        padding: 13px 15px 13px 13px;
        border-radius: 20px;
        color: var(--text);
        border: 1px solid rgba(255,255,255,0.13);
        background:
          linear-gradient(180deg, rgba(255,255,255,0.105), rgba(255,255,255,0.048)),
          rgba(7, 10, 22, 0.74);
        -webkit-backdrop-filter: blur(24px) saturate(130%);
        backdrop-filter: blur(24px) saturate(130%);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.06),
          0 18px 46px rgba(0,0,0,0.42);
        overflow: hidden;
        opacity: 0;
        transform: translate3d(18px, -8px, 0) scale(0.975);
        filter: blur(8px);
        transition:
          opacity 260ms cubic-bezier(0.22, 1, 0.36, 1),
          transform 420ms cubic-bezier(0.16, 1, 0.3, 1),
          filter 420ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      .event-notification.is-visible {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
        filter: none;
      }

      .event-notification.is-leaving {
        opacity: 0;
        transform: translate3d(22px, -8px, 0) scale(0.97);
        filter: blur(8px);
      }

      .event-notification::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at top left, rgba(0,142,248,0.20), transparent 44%),
          radial-gradient(circle at bottom right, rgba(200,0,224,0.15), transparent 42%);
        pointer-events: none;
      }

      .event-notification.is-warning::before {
        background:
          radial-gradient(circle at top left, rgba(222,104,0,0.24), transparent 44%),
          radial-gradient(circle at bottom right, rgba(200,0,224,0.12), transparent 42%);
      }

      .event-notification-icon {
        position: relative;
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        background: rgba(255,255,255,0.09);
        border: 1px solid rgba(255,255,255,0.10);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
        font-size: 20px;
      }

      .event-notification-copy {
        position: relative;
        min-width: 0;
      }

      .event-notification-title {
        margin: 0;
        font-size: 14px;
        font-weight: 800;
        line-height: 1.2;
        letter-spacing: -0.01em;
      }

      .event-notification-message {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.3;
        white-space: normal;
        overflow-wrap: anywhere;
      }

      @media (max-width: 620px) {
        .event-notifications {
          top: 10px;
          left: 10px;
          right: 10px;
          width: auto;
        }

        .event-notification {
          transform: translate3d(0, -14px, 0) scale(0.98);
        }

        .event-notification.is-visible {
          transform: translate3d(0, 0, 0) scale(1);
        }

        .event-notification.is-leaving {
          transform: translate3d(0, -14px, 0) scale(0.98);
        }
      }
      
      @media (max-width: 1580px) {
        .player-layout,
        .player-layout.is-tv-open {
          width: min(100%, 620px);
          flex-direction: column;
          gap: 14px;
          padding-bottom: 46px;
          transition: width 520ms cubic-bezier(.16,1,.3,1), max-width 520ms cubic-bezier(.16,1,.3,1),
            padding-bottom 420ms cubic-bezier(.22,1,.36,1);
        }
      
        body.is-ready .player-layout.is-tv-open .player-card {
          transform: scale(1);
        }
      
        .tv-corner-button {
          top: var(--mobile-queue-height, 620px);
          translate: 0 8px;
          right: 4px;
          bottom: auto;
          scale: 0.70;
          transition-property: opacity, transform, filter, background, box-shadow, translate, right;
          transition-duration: 760ms, 980ms, 980ms, 180ms, 180ms, 420ms, 420ms;
        }

        .player-layout.is-tv-open { padding-bottom: 0; }
        .player-layout.is-tv-open .tv-corner-button {
          transition-duration: 380ms, 980ms, 980ms, 180ms, 180ms, 420ms, 420ms;
        }
      
        .tv-panel {
          flex: 0 0 0;
          width: 100%;
          min-width: 0;
          max-width: none;
          height: 0;
          padding: 0;
          transform: translateY(14px) scale(0.985);
        }
      
        .player-layout.is-tv-open .tv-panel {
          flex: 0 0 auto;
          width: 100%;
          min-width: 0;
          max-width: none;
          height: auto;
          padding: 16px;
          border-width: 1px;
          transform: translateY(0) scale(1);
        }
      
        .tv-video-shell {
          height: auto;
          aspect-ratio: auto;
        }
      }

      @media (min-width: 800px) and (max-width: 1580px) {
        .player-layout { padding-bottom: 0; }
        .tv-corner-button {
          translate: 0 -60px;
          right: -63px;
        }
      }

      @media (max-width: 860px) {
        iframe {
          max-height: min(61.2vh, 646px);
        }
      }

      @media (max-width: 620px) {
        .page {
          padding: 14px 10px 18px;
        }
      
        .brand {
          padding-inline: 10px;
        }
      
        iframe {
          max-height: 66.3vh;
        }

        .tv-corner-button {
          right: 12px;
          bottom: auto;
        }
      }

      @media (min-width: 1581px) {
        .player-layout {
          left: 50%; margin: 0; translate: -50% 0; gap: 0;
          min-width: 0;
          width: min(calc(100vw - 56px), calc(620px + var(--desktop-side-space, 136px)));
          transition: width 600ms cubic-bezier(.4,0,.2,1);
        }
        .player-layout::before {
          content: ""; flex: 0 0 var(--desktop-side-space, 136px);
          transition: flex-basis 600ms cubic-bezier(.4,0,.2,1);
        }
        .player-layout .player-card {
          width: calc(100% - var(--desktop-side-space, 136px));
          flex-basis: calc(100% - var(--desktop-side-space, 136px));
          transition: width 600ms cubic-bezier(.4,0,.2,1), flex-basis 600ms cubic-bezier(.4,0,.2,1),
            opacity 760ms cubic-bezier(.22,1,.36,1), filter 1080ms cubic-bezier(.22,1,.36,1), transform 520ms cubic-bezier(.22,1,.36,1), box-shadow 220ms ease;
        }
        .player-layout.is-tv-open { width: min(calc(100vw - 56px), 1640px); }
        .player-layout.is-tv-open .player-card {
          width: calc((100% - var(--desktop-side-space, 136px) - 14px) * .4);
          flex-basis: calc((100% - var(--desktop-side-space, 136px) - 14px) * .4);
        }
        body.is-ready .player-layout.is-tv-open .player-card { transform: scale(1); }
        #queue-player-frame {
          width: calc(100% + 40px + var(--desktop-side-space, 136px));
          margin-left: calc(-20px - var(--desktop-side-space, 136px));
          transition: width 600ms cubic-bezier(.4,0,.2,1), margin-left 600ms cubic-bezier(.4,0,.2,1), height 400ms cubic-bezier(.22,1,.36,1);
        }
        .player-layout .tv-panel {
          margin-left: 0; min-width: 0; max-width: none;
          height: calc(var(--queue-height, min(64.6vh, 748px)) + 2px);
          grid-template-rows: minmax(0, 1fr);

          {

            phaseB: 1.1,

            radius: 300,
            alpha: 0.11,
            xMulA: 0.12,
            xMulB: 0.16,
            yMulA: 0.11,
            yMulB: 0.08,
            speedA: 0.17,
            speedB: 0.12,
            speedC: 0.11,
            speedD: 0.14,
            phaseA: 1.4,
            phaseB: 2.4,
            phaseC: 0.9,
            phaseD: 3.1
          },
          {
            color: [222, 104, 0],
            radius: 400,
            alpha: 0.10,
            xMulA: 0.17,
            xMulB: 0.09,
            yMulA: 0.12,
            yMulB: 0.11,
            speedA: 0.09,
            speedB: 0.16,
            speedC: 0.18,
            speedD: 0.12,
            phaseA: 2.9,
            phaseB: 0.4,
            phaseC: 2.2,
            phaseD: 1.3

        function resizeCanvas() {
          width = window.innerWidth;
          height = window.innerHeight;
          dpr = Math.min(window.devicePixelRatio || 1, 1.25);
        
          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
          canvas.style.width = width + "px";
          canvas.style.height = height + "px";
        
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          rebuildGradients();
        }
        
        function rebuildGradients() {
          baseGradient = ctx.createLinearGradient(0, 0, 0, height);
          baseGradient.addColorStop(0, "#091022");
          baseGradient.addColorStop(0.58, "#050816");
          baseGradient.addColorStop(1, "#03040b");
        
          centerGlow = ctx.createRadialGradient(
            width * 0.5,
            height * 0.35,
            0,
            width * 0.5,
            height * 0.35,
            Math.max(width, height) * 0.75
          );
          centerGlow.addColorStop(0, "rgba(255,255,255,0.030)");
          centerGlow.addColorStop(1, "rgba(255,255,255,0)");
        
          scrimGradient = ctx.createLinearGradient(0, 0, 0, height);
          scrimGradient.addColorStop(0, "rgba(0,0,0,0.08)");
          scrimGradient.addColorStop(0.45, "rgba(0,0,0,0.02)");
          scrimGradient.addColorStop(1, "rgba(0,0,0,0.16)");
        }
        
        function drawBase() {
          ctx.fillStyle = baseGradient;
          ctx.fillRect(0, 0, width, height);
        
          ctx.fillStyle = centerGlow;
          ctx.fillRect(0, 0, width, height);
        }
        
        function drawOrb(x, y, radius, rgb, alpha) {
          const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
          gradient.addColorStop(0, `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${alpha})`);
          gradient.addColorStop(0.38, `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${alpha * 0.64})`);
          gradient.addColorStop(0.72, `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${alpha * 0.18})`);
          gradient.addColorStop(1, `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, 0)`);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.fill();
        }
        
        function drawReducedMotionScene() {
          drawBase();
          ctx.globalCompositeOperation = "screen";
          drawOrb(width * 0.24, height * 0.28, 300, [0, 142, 248], 0.18);
          drawOrb(width * 0.76, height * 0.24, 290, [200, 0, 224], 0.18);
          drawOrb(width * 0.28, height * 0.78, 250, [74, 227, 0], 0.10);
          drawOrb(width * 0.78, height * 0.74, 270, [222, 104, 0], 0.14);
          ctx.globalCompositeOperation = "source-over";
          ctx.fillStyle = scrimGradient;
          ctx.fillRect(0, 0, width, height);
        }
        
        function render(now) {
          if (now - lastFrameTime < FRAME_TIME) {
            rafId = window.requestAnimationFrame(render);
            return;
          }
        
          lastFrameTime = now;
        
          const t = now * 0.0014;
          drawBase();
        
          ctx.globalCompositeOperation = "screen";
        
          for (const orb of orbs) {
            const x = width * (
              0.5
              + orb.xMulA * Math.sin(t * orb.speedA + orb.phaseA)
              + orb.xMulB * Math.sin(t * orb.speedB + orb.phaseB)
            );
        
            const y = height * (
              0.5
              + orb.yMulA * Math.cos(t * orb.speedC + orb.phaseC)
              + orb.yMulB * Math.sin(t * orb.speedD + orb.phaseD)
            );
        
            const radius = orb.radius * (
              1
              + 0.09 * Math.sin(t * (orb.speedA + orb.speedC + orb.speedD * 0.5) + orb.phaseB)
            );
        
            drawOrb(x, y, radius, orb.color, orb.alpha);
          }
        
          ctx.globalCompositeOperation = "source-over";
          ctx.fillStyle = scrimGradient;
          ctx.fillRect(0, 0, width, height);
        
          rafId = window.requestAnimationFrame(render);
        }
        
        resizeCanvas();
        
        if (prefersReducedMotion) {
          drawReducedMotionScene();
        } else {
          rafId = window.requestAnimationFrame(render);
        }
        
        let resizeTimer = 0;
        window.addEventListener("resize", function () {
          window.clearTimeout(resizeTimer);
          resizeTimer = window.setTimeout(function () {
            resizeCanvas();
            if (prefersReducedMotion) {

            }

        }, { passive: true });

          }
        });

          window.clearTimeout(tvIntroTimer);
          tvIntroTimer = window.setTimeout(function () {
            document.body.classList.add("is-tv-intro-done");
          }, 1500);
        });
      })();

        const placements = new Map();
        let placementFrame = 0, placementTime = 0, placementRequested = 0;
        const placementKeys = ["left", "top", "width", "height"];
        function placementTargets() {
          // Measure natural layout for the whole batch before applying visual offsets.
          placementElements.forEach(element => { element.style.translate = "none"; element.style.scale = "1"; });
          return placementElements.map(element => element.getBoundingClientRect());

          placementFrame = 0;
          const dt = placementTime ? Math.min(.064, Math.max(0, (now - placementTime) / 1000)) : 0;
          placementTime = now;
          const targets = placementTargets();
          const animate = document.body.classList.contains("is-logo-docked") &&
            !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          let moving = false;

            const target = targets[index];
            let state = placements.get(element);
            if (!state || !animate || !target.width || !target.height) {
              state = {position: {}, velocity: {}};
              placementKeys.forEach(key => { state.position[key] = target[key]; state.velocity[key] = 0; });

                state.velocity[key] = (state.velocity[key] - frequency * carry * dt) * decay;
                if (Math.abs(state.position[key] - target[key]) > .05 || Math.abs(state.velocity[key]) > .05) moving = true;
              });
              element.style.transformOrigin = "top left";
              element.style.translate = (state.position.left - target.left) + "px " + (state.position.top - target.top) + "px";
              element.style.scale = state.position.width / target.width + " " + state.position.height / target.height;
            }
          });
          if (animate && (moving || now - placementRequested < 650)) {
            placementFrame = window.requestAnimationFrame(trackPlacements);
          } else {
            placementElements.forEach(element => { element.style.translate = ""; element.style.scale = ""; });
            placementTime = 0;
          }
        }
        function settlePlacements() {
          placementRequested = performance.now();
          if (!placementFrame) trackPlacements(placementRequested);
        }
        function syncTvAnchor() { syncHeight(); }
        function syncHeight() {
          const desktop = desktopQuery.matches;
          const home = desktop && !wantsTv ? logoHome : logoSlot;
          if (brand.parentElement !== home) home.appendChild(brand);
          const style = window.getComputedStyle(page);
          const padding = parseFloat(style.paddingTop) + parseFloat(style.paddingBottom);
          // svh is stable when the mobile address bar moves. A keyboard may shrink it.
          const stableHeight = viewportProbe.getBoundingClientRect().height || window.innerHeight;
          const viewportHeight = desktop ? window.innerHeight : Math.min(stableHeight, window.visualViewport?.height || stableHeight);
          const reserve = desktop ? (wantsTv ? Math.ceil(logoSlot.offsetHeight || 50) + 32 : 0) : 112;
          const available = Math.max(120, Math.floor(viewportHeight - padding - reserve - 2));
          const tvHeight = !desktop && wantsTv ? Math.max(120, Math.min(Math.round((Math.min(620, window.innerWidth - 28) - 42) * 9 / 16 + 78), Math.floor(available * .44))) : 0;
          const height = Math.max(96, available - tvHeight - (tvHeight ? 14 : 0));
          playerLayout.style.setProperty("--dock-reserve", reserve + "px");
          playerLayout.style.setProperty("--mobile-tv-height", tvHeight + "px");
          playerLayout.style.setProperty("--mobile-content-height", height + tvHeight + (tvHeight ? 14 : 0) + 2 + "px");
          playerLayout.style.setProperty("--queue-height", height + "px");
          frame.style.height = height + "px";
          frame.style.maxHeight = "none";
          queuePanels()?.setVisibleHeight?.(height);
          settlePlacements();
        }
        function syncLayout() {
          if (desktopQuery.matches && queuePanels()?.current()) closeTv();
          queuePanels()?.setDesktop(desktopQuery.matches);
          setDrawer(leftDrawer);
          syncHeight();
        }

        function finishTvMotion() {
          if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return Promise.resolve();
          return new Promise(resolve => window.setTimeout(resolve, 620));
        }
        window.furaticPlayerPanels = {
          setDrawer, syncLayout,
          beforeDrawer: async function () {
            const wasOpen = panel.classList.contains("is-open");
            closeTv();
            if (wasOpen) await finishTvMotion();
          },
        };
        frame.addEventListener("load", syncLayout);
        window.addEventListener("resize", syncLayout, {passive: true});
        window.visualViewport?.addEventListener("resize", syncHeight, {passive: true});
        if (window.ResizeObserver) {
          new ResizeObserver(syncHeight).observe(page);
          new ResizeObserver(settlePlacements).observe(playerLayout);
        }
        syncLayout();
        window.setTimeout(syncHeight, 1200);

        function canUseNativeHls() {
          return video.canPlayType("application/vnd.apple.mpegurl");
        }

        function canUseHlsJs() {
          return Boolean(window.Hls && window.Hls.isSupported());
        }

        function clearStreamWatchdog() {
          window.clearTimeout(streamWatchdog);
          streamWatchdog = 0;
        }

        function armStreamWatchdog(delay) {
          clearStreamWatchdog();
          if (disposed || streamFailed || streamReloading || !hasLoadedStream) return;
          const generation = streamGeneration;
          const position = video.currentTime;
          streamWatchdog = window.setTimeout(function () {
            streamWatchdog = 0;
            if (generation === streamGeneration && video.currentTime === position &&
                (!video.paused || pendingPlayAttempt)) retryStream();
          }, delay);
        }

        function resetStreamSource() {
          hasLoadedStream = false;
          pendingPlayAttempt = false;
          streamGeneration++;
          clearStreamWatchdog();
          const previous = hlsInstance;
          hlsInstance = null;
          if (previous) previous.destroy();
          video.pause();
          video.removeAttribute("src");
          video.load();
        }

        function retryStream() {
          // Native media and HLS errors share one timer and one retry budget.
          if (disposed || streamFailed || streamReloading || !hasLoadedStream) return;
          streamReloading = true;
          streamGeneration++;
          pendingPlayAttempt = false;
          clearStreamWatchdog();
          video.pause();
          if (hlsInstance) hlsInstance.stopLoad();
          if (retryIndex >= retryDelays.length) {
            streamFailed = true;
            resetStreamSource();
            video.muted = true;
            video.controls = false;
            streamError.hidden = false;
            videoShell.classList.add("is-stream-error");
            return;
          }
          const delay = retryDelays[retryIndex++] * 1000;
          retryTimer = window.setTimeout(function () {
            retryTimer = 0;
            if (disposed || streamFailed) return;
            resetStreamSource();
            streamReloading = false;
            pendingPlayAttempt = true;
            ensureStream();
            void tryPlayLive();
          }, delay);
        }

        function ensureStream() {
          if (disposed || streamFailed || streamReloading || hasLoadedStream || !hlsUrl || !wantsTv) return;
          hasLoadedStream = true;
          streamGeneration++;
          try {
            if (canUseNativeHls()) {
              video.src = hlsUrl;
              video.load();
            } else if (canUseHlsJs()) {
              const config = {enableWorker: true, lowLatencyMode: true, backBufferLength: 20};
              // HLS's internal retries must not compete with the exact schedule.
              ["manifestLoadPolicy", "playlistLoadPolicy", "fragLoadPolicy", "keyLoadPolicy",
                "certLoadPolicy", "steeringManifestLoadPolicy"].forEach(function (name) {
                config[name] = {default: Object.assign({}, window.Hls.DefaultConfig[name].default,
                  {timeoutRetry: null, errorRetry: null})};
              });
              const instance = new window.Hls(config);
              hlsInstance = instance;
              instance.on(window.Hls.Events.ERROR, function (_event, data) {
                if (hlsInstance === instance && (data.fatal || data.type === window.Hls.ErrorTypes.NETWORK_ERROR)) retryStream();
              });
              instance.loadSource(hlsUrl);
              instance.attachMedia(video);
            }
            // Bound a silent initial load; active playback stalls get 2 seconds.
            armStreamWatchdog(10000);
          } catch (_error) {
            retryStream();
          }
        }

        function syncTvToggle(open) {
          toggleButton.setAttribute("aria-pressed", open ? "true" : "false");
          toggleButton.setAttribute("aria-label", open ? "Hide TV panel" : "Open TV panel");
          toggleButton.setAttribute("title", open ? "Hide TV panel" : "Open TV panel");
        }

        function jumpToLiveEdge() {
          try {
            if (
              hlsInstance &&
              typeof hlsInstance.liveSyncPosition === "number" &&
              Number.isFinite(hlsInstance.liveSyncPosition)
            ) {
              video.currentTime = Math.max(0, hlsInstance.liveSyncPosition);
              return true;
            }
          } catch (_error) {
            // ignore
          }

          try {
            if (video.seekable && video.seekable.length > 0) {
              const liveEdge = video.seekable.end(video.seekable.length - 1);
              if (Number.isFinite(liveEdge) && liveEdge > 0) {
                video.currentTime = Math.max(0, liveEdge - 0.35);
                return true;
              }
            }
          } catch (_error) {
            // ignore
          }

          return false;
        }

        async function tryPlayLive() {
          if (disposed || streamFailed || streamReloading || !hasLoadedStream || !wantsTv) return false;
          const generation = streamGeneration;
          try {
            video.muted = !panel.classList.contains("is-open");
            await video.play();
            if (generation === streamGeneration) pendingPlayAttempt = false;
            return true;
          } catch (error) {
            if (generation === streamGeneration && !streamReloading && !streamFailed) {
              // Browser permission blocks and DOM-move aborts are not network failures.
              if (error.name === "NotAllowedError") {
                pendingPlayAttempt = false;
                clearStreamWatchdog();
              } else if (error.name !== "AbortError") retryStream();
            }
            return false;
          }
        }

        async function openTv() {
          wantsTv = true;
          if (desktopQuery.matches) await queuePanels()?.close();
          if (!wantsTv) return;
          const shouldJumpToLive = hasOpenedTvOnce;

          playerLayout.classList.add("is-tv-open");
          panel.classList.add("is-open");
          panel.setAttribute("aria-hidden", "false");
          panel.removeAttribute("inert");
          syncTvToggle(true);
          syncHeight();
          videoShell.appendChild(video);
          video.controls = !streamFailed;
          video.tabIndex = 0;
          video.removeAttribute("aria-hidden");

          hasOpenedTvOnce = true;
          pendingPlayAttempt = true;
          ensureStream();

          if (shouldJumpToLive) {
            jumpToLiveEdge();
          }

          void tryPlayLive();
        }

        function closeTv() {
          video.muted = true;
          wantsTv = false;
          pendingPlayAttempt = true;
          playerLayout.classList.remove("is-tv-open");
          panel.classList.remove("is-open");
          panel.setAttribute("aria-hidden", "true");
          panel.setAttribute("inert", "");
          syncTvToggle(false);

          pendingPlayAttempt = false;
          clearStreamWatchdog();
          video.pause();
          syncHeight();
        }

        video.addEventListener("playing", function () {
          if (disposed || streamFailed || streamReloading || !hasLoadedStream) return;
          const generation = streamGeneration;
          const reveal = function () {
            if (disposed || generation !== streamGeneration || streamFailed || streamReloading) return;
            retryIndex = 0;
            streamError.hidden = true;
            videoShell.classList.remove("is-stream-error");
            armStreamWatchdog(2000);
          };
          if (typeof video.requestVideoFrameCallback === "function") video.requestVideoFrameCallback(reveal);
          else window.requestAnimationFrame(reveal);
        });
        video.addEventListener("error", function () {
          if (video.error && video.error.code !== 1) retryStream();
        });
        video.addEventListener("ended", retryStream);
        ["waiting", "stalled"].forEach(function (event) {
          video.addEventListener(event, function () {
            if (!video.paused || pendingPlayAttempt) armStreamWatchdog(2000);
          });
        });
        video.addEventListener("timeupdate", function () {
          if (!video.paused) armStreamWatchdog(2000);
        });
        video.addEventListener("pause", function () {
          if (!pendingPlayAttempt) clearStreamWatchdog();
        });
        window.addEventListener("beforeunload", function () {
          disposed = true;
          window.clearTimeout(retryTimer);
          retryTimer = 0;
          resetStreamSource();
        });
        video.addEventListener("volumechange", function () {
          if (!panel.classList.contains("is-open") && !video.muted) video.muted = true;
        });

        if (!hlsUrl || (!canUseNativeHls() && !canUseHlsJs())) {
          toggleButton.disabled = true;
          toggleButton.setAttribute("aria-label", "TV unavailable");
          toggleButton.setAttribute("title", "TV unavailable");
          return;
        }

        syncTvToggle(false);

        toggleButton.addEventListener("click", function () {
          if (wantsTv || panel.classList.contains("is-open")) {
            closeTv();
          } else {
            void openTv();
          }
        });

        closeButton.addEventListener("click", function () {
          closeTv();
        });

        video.addEventListener("loadedmetadata", function () {
          if (pendingPlayAttempt) {
            void tryPlayLive();
          }
        });

        video.addEventListener("canplay", function () {
          if (pendingPlayAttempt) {
            void tryPlayLive();
          }
        });
      })();

    </script>
    <script>
      (async function () {
        const logo = document.getElementById("brand-logo");
        const brand = document.getElementById("brand");
        const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const background = document.getElementById("visualizer-background");
        function reveal() {
          document.body.classList.add("is-logo-docked", "is-ready", "is-tv-intro-done");
          background.src = background.dataset.src;
          window.dispatchEvent(new Event("furatic:intro-complete"));
        }
        window.addEventListener("message", function (event) {
          if (event.source === background.contentWindow && event.origin === window.location.origin &&
              event.data?.type === "furatic:visualizer-ready") document.getElementById("stream-background").classList.add("is-ready");
        });
        await Promise.race([logo.decode?.().catch(() => undefined), new Promise(resolve => window.setTimeout(resolve, 2500))]);
        if (reduced || typeof logo.animate !== "function") { reveal(); return; }
        const visual = logo.cloneNode(true);
        visual.removeAttribute("id"); visual.setAttribute("aria-hidden", "true"); visual.className = "logo-intro";
        const width = Math.min(440, window.innerWidth * .76);
        const height = width * (logo.naturalHeight / logo.naturalWidth || .33);
        Object.assign(visual.style, {width: width + "px", height: height + "px",
          left: (window.innerWidth - width) / 2 + "px", top: (window.innerHeight - height) / 2 + "px"});
        document.body.appendChild(visual);
        const entrance = visual.animate([
          {opacity: 0, filter: "blur(18px)", transform: "scale(.94)"},
          {opacity: 1, filter: "blur(0px)", transform: "scale(1.025)", offset: .8},
          {opacity: 1, filter: "blur(0px)", transform: "scale(1)"}
        ], {duration: 900, easing: "cubic-bezier(.22,1,.36,1)", fill: "both"});
        await entrance.finished.catch(() => undefined);
        await new Promise(resolve => window.setTimeout(resolve, 150));
        entrance.cancel();
        let flight = null, resized = false;
        const retarget = () => {
          if (!flight) return;
          const current = visual.getBoundingClientRect();
          resized = true; flight.cancel();
          Object.assign(visual.style, {left: current.left + "px", top: current.top + "px", width: current.width + "px", height: current.height + "px", transform: "none"});
        };
        window.addEventListener("resize", retarget);
        do {
          resized = false;
          await new Promise(resolve => window.requestAnimationFrame(resolve));
          const from = visual.getBoundingClientRect(), to = brand.getBoundingClientRect();
          flight = visual.animate([
            {transform: "translate(0,0) scale(1)"},
            {transform: "translate(" + (to.left + to.width / 2 - from.left - from.width / 2) + "px," +
              (to.top + to.height / 2 - from.top - from.height / 2) + "px) scale(" + to.width / from.width + ")"}
          ], {duration: 1100, easing: "cubic-bezier(.4,0,.2,1)", fill: "both"});
          await flight.finished.catch(() => undefined);
        } while (resized);
        window.removeEventListener("resize", retarget);
        reveal(); visual.remove(); flight?.cancel();
      })();
    </script>

    <script>
      (function () {
        const container = document.getElementById("event-notifications");
        const endpoint = "/api/notifications/";
        const maxVisible = 3;
        const visible = new Set();

        let latestNotificationId = 0;
        let primed = false;
        let pollTimer = 0;

        function normalizeText(value, fallback) {
          const text = String(value || "").trim();
          return text || fallback;
        }

        function removeNotification(element) {
          if (!element || element.classList.contains("is-leaving")) {
            return;
          }

          element.classList.remove("is-visible");
          element.classList.add("is-leaving");

          window.setTimeout(function () {
            visible.delete(element);
            element.remove();
          }, 460);
        }

        function pruneVisible() {
          while (visible.size > maxVisible) {
            const first = visible.values().next().value;
            removeNotification(first);
          }
        }

        function showNotification(item) {
          const element = document.createElement("section");
          const level = normalizeText(item.level, "info");
          const title = normalizeText(item.title, "FURATIC update");
          const message = normalizeText(item.message, "");
          const icon = normalizeText(item.icon, "✨");

          element.className = "event-notification is-" + level;
          element.setAttribute("role", "status");
          element.innerHTML = `
            <div class="event-notification-icon" aria-hidden="true"></div>
            <div class="event-notification-copy">
              <p class="event-notification-title"></p>
              <p class="event-notification-message"></p>
            </div>
          `;

          element.querySelector(".event-notification-icon").textContent = icon;
          element.querySelector(".event-notification-title").textContent = title;
          element.querySelector(".event-notification-message").textContent = message;

          container.appendChild(element);
          visible.add(element);
          pruneVisible();

          window.requestAnimationFrame(function () {
            element.classList.add("is-visible");
          });

          window.setTimeout(function () {
            removeNotification(element);
          }, 6200);
        }

        async function pollNotifications() {
          try {
            const response = await fetch(endpoint + "?after=" + latestNotificationId, {
              cache: "no-store",
              credentials: "same-origin",
            });

            if (!response.ok) {
              return;
            }

            const data = await response.json();
            const notifications = Array.isArray(data.notifications)
              ? data.notifications
              : [];

            if (typeof data.latest === "number" && Number.isFinite(data.latest)) {
              latestNotificationId = Math.max(latestNotificationId, data.latest);
            }

            if (!primed) {
              primed = true;
              return;
            }

            for (const notification of notifications) {
              const id = Number(notification.id || 0);
              latestNotificationId = Math.max(latestNotificationId, id);
              if (!String(notification.kind).startsWith("song_request_")) showNotification(notification);
            }
          } catch (_error) {
            // Silent retry. Notifications are non-critical UI.
          }
        }

        pollNotifications();
        pollTimer = window.setInterval(pollNotifications, 2500);

        window.addEventListener("beforeunload", function () {
          if (pollTimer) {
            window.clearInterval(pollTimer);
          }
        });
      })();
      
      let redirectingToAfterHours = false;
      
      async function pollMode() {
        try {
          const response = await fetch("/api/site-mode/", { cache: "no-store" });
          if (!response.ok) return;
          const data = await response.json();
      
          if (data.mode === "afterhours" && !redirectingToAfterHours) {
            redirectingToAfterHours = true;
      
            const frame = document.getElementById("queue-player-frame");
            try {
              frame?.contentWindow?.postMessage(
                { type: "furatic:shutdown-state-socket" },
                window.location.origin
              );
            } catch (_error) {
              // ignore
            }
      
            window.setTimeout(function () {
              window.location.replace("/afterhours/");
            }, 150);
          }
        } catch (_error) {
          // silent retry
        }
      }
      
      setInterval(pollMode, 7000);
    </script>
